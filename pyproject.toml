[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-tokenizer"
version = "0.1.0"
description = "FaCT: Factorized Causal Tokenizer - a semi-discrete, causal, content/prosody-factorized speech representation for TTS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "torchaudio",
    "pyworld>=0.3",
    "praat-parselmouth>=0.4",
    "soundfile",
]
dev = [
    "pytest>=7.0",
]
eval = [
    "pesq>=0.0.4",
    "pystoi>=0.4",
    "transformers>=4.45",        # Mimi baseline
    "descript-audio-codec>=1.0", # DAC baseline
    "datasets>=2.20",            # eval-set preparation (login node)
]

[tool.setuptools.packages.find]
include = ["fact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
