[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-tokenizer"
version = "0.1.0"
description = "FaCT: Factorized Causal Tokenizer - a semi-discrete, causal, content/prosody-factorized speech representation for TTS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "torchaudio",
    "pyworld>=0.3",
    "praat-parselmouth>=0.4",
    "soundfile",
]
dev = [
    "pytest>=7.0",
]
eval = [
    "pesq>=0.0.4",
    "pystoi>=0.4",
    # Mimi baseline. Newer releases call torch.accelerator (torch >= 2.6)
    # at import time; keep the pair compatible with the installed torch.
    "transformers>=4.45,<4.50",
    "descript-audio-codec>=1.0", # DAC baseline
    # Eval-set preparation (login node). 5.x needs huggingface-hub >= 1.31,
    # which the transformers pin above (< 4.50) cannot use; 4.1 works with both.
    "datasets>=3.0,<4.2",
    # WER hook (scripts/eval_baselines.py --wer-model); install with the
    # installed torch/numpy pinned as constraints so it cannot move them.
    "openai-whisper==20240930",
]

[tool.setuptools.packages.find]
include = ["fact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
