# Matched internal baseline #1: single FSQ head, no factorization.
# The lattice is the union of FaCT's content and prosody lattices:
# 8*8*8*4*4 * 5*5*5*5 = 5,120,000 codes (2^22.29) over 9 dims - exactly the
# same bits and dims as the factorized pair. Isolates RQ2 (does the split
# itself help?). Everything else identical to fact_base.yaml.
audio:
  sample_rate: 24000
  n_mels: 100
  n_fft: 1024
  hop_length: 480
  win_length: 960
  fmin: 0.0
  fmax: 12000.0

encoder:
  dim: 768
  n_layers_pre: 6
  n_layers_post: 10
  n_heads: 12
  frame_stack: 4

bottleneck:
  variant: single_fsq
  single_levels: [8, 8, 8, 4, 4, 5, 5, 5, 5]
  residual_dim: 16
  residual_kl_weight: 0.01

ctc:
  n_layers: 4
  n_heads: 8
  dim: 512
  vocab_size: 257     # 256 byte values (shifted +1) + blank
  upsample: 2         # CTC positions per token; keep ctc_infeasible ~0
  weight: 1.0

decoder:
  dim: 1024
  n_layers: 12
  n_heads: 16
  block_size: 8
  cfg_dropout: 0.1
  max_shortcut_log2: 7

train:
  lr: 0.0003
  max_steps: 400000
  warmup_steps: 5000
  batch_seconds: 320.0
