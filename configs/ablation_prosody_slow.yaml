# P1 ablation: multi-rate factorization - prosody tokens at 6.25 Hz under
# 12.5 Hz content (prosody_rate_divisor: 2). Prosody varies slower than
# phonetics; no published factorized codec exploits rate asymmetry between
# streams. Bitrate: prosody 9.3 bits x 6.25 Hz = 58 bps (vs 116), total
# ~221 bps discrete. Decision column: F0 RMSE - if coarser prosody tracking
# costs accuracy, this stays an ablation; if not, it becomes the main arm.
audio:
  sample_rate: 24000
  n_mels: 100
  n_fft: 1024
  hop_length: 480
  win_length: 960
  fmin: 0.0
  fmax: 12000.0

encoder:
  dim: 768
  n_layers_pre: 6
  n_layers_post: 10
  n_heads: 12
  frame_stack: 4

bottleneck:
  variant: factorized
  content_levels: [8, 8, 8, 4, 4]
  prosody_levels: [5, 5, 5, 5]
  prosody_rate_divisor: 2
  residual_dim: 16
  residual_kl_weight: 0.01

ctc:
  n_layers: 4
  n_heads: 8
  dim: 512
  vocab_size: 257
  upsample: 2
  weight: 1.0

prosody:
  f0_bins: 64
  f0_min: 50.0
  f0_max: 550.0
  f0_weight: 1.0
  energy_weight: 1.0

leakage:
  grl_lambda: 0.5
  content_to_f0_weight: 0.5
  prosody_to_text_weight: 0.5

speaker:
  dim: 256
  n_layers: 4

decoder:
  dim: 1024
  n_layers: 12
  n_heads: 16
  block_size: 8
  cfg_dropout: 0.1
  max_shortcut_log2: 7

train:
  lr: 0.0003
  max_steps: 400000
  warmup_steps: 5000
  batch_seconds: 320.0
