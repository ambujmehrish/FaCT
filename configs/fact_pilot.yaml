# Pilot config (plan week 3-4 de-risk): ~110M total, 5K-h Emilia EN slice,
# 100K steps on one Leonardo node (4x A100-64GB). AUDIO/BOTTLENECK/CTC
# semantics identical to fact_base (same lattices, same byte text, same
# 12.5 Hz) so pilot tripwire readings transfer to the full model; only the
# transformer widths/depths are scaled down.
# audio.mel_mean/mel_std: from shards/pilot/stats.json (1,997,997 utts,
# 5,162 h of Emilia-EN); training refuses to start on a mismatch.
audio:
  sample_rate: 24000
  n_mels: 100
  n_fft: 1024
  hop_length: 480
  win_length: 960
  fmin: 0.0
  fmax: 12000.0
  mel_mean: -3.8881
  mel_std: 4.9989

encoder:             # ~40M
  dim: 512
  n_layers_pre: 4
  n_layers_post: 8
  n_heads: 8
  frame_stack: 4

bottleneck:
  variant: factorized
  content_levels: [8, 8, 8, 4, 4]
  prosody_levels: [5, 5, 5, 5]
  residual_dim: 16
  residual_kl_weight: 0.01   # unused when residual_capacity > 0
  # Residual-capacity sweep (50K steps, 1 GPU, f0 adversary; tripwires on
  # 256 pilot_dev utts). Ratio = residual zeroing delta / prosody's (R2: <= 3):
  #   C (nats/frame)  bit/s  recon   ratio   CER
  #   0 (no residual)    0   0.3032   -     0.365
  #   1                 18   0.3006  0.2    0.372
  #   2                 36   0.2996  0.4    0.372
  #   4                 72   0.2982  0.6    0.372
  #   8                144   0.2930  0.9    0.372   <- largest passing
  #   uncapped (KL)    ~380          6.3 (pilot 100K)
  residual_capacity: 8.0

ctc:
  n_layers: 4
  n_heads: 8
  dim: 384
  vocab_size: 257
  upsample: 2
  # lambda_ctc sweep: 50K steps, 1 GPU, 256 pilot_dev utts; padding-masked
  # metrics (fact/eval/grounding.py). Two seeds where shown (1234 / 2).
  #   lam  recon          byte-CER       util   content ppl
  #   0.3  0.2651         0.680          0.225    852   content stream bypassed
  #   1.0  0.2696/0.2696  0.438/0.429    0.805   4548/4739
  #   3.0  0.2711/0.2689  0.389/0.389    0.756   3843/3885   <- chosen
  #   10   0.2780         0.383          0.712   3139
  # Seed spread: recon <= 0.0022, CER <= 0.009. lam=3 vs 1: same recon,
  # CER -0.045. lam=10 vs 3: CER within seed noise, recon +0.008 (~4x the
  # spread) - CER plateaus while recon pays (RISK R3's "too high" signature).
  weight: 3.0

prosody:
  f0_bins: 64
  f0_min: 50.0
  f0_max: 550.0
  f0_weight: 1.0
  energy_weight: 1.0

leakage:
  grl_lambda: 0.5
  content_to_f0_weight: 0.5
  prosody_to_text_weight: 0.5
  # Pilot 100K with target "f0" (held-out probes, acc / majority):
  #   pitch (voiced frames): content 0.036/0.040  prosody 0.661  residual 0.042
  #   voicing:               content 0.589/0.508  prosody 0.875  residual 0.748
  # Pitch is cleanly confined to prosody, but the adversary also stripped
  # phonetic voicing from content (22% of the attainable gain kept), and the
  # residual carries it instead. "pitch" removes pitch height only.
  content_to_f0_target: pitch

speaker:
  dim: 192
  n_layers: 3

decoder:             # ~60M
  dim: 640
  n_layers: 10
  n_heads: 10
  block_size: 8
  cfg_dropout: 0.1
  max_shortcut_log2: 7

train:
  lr: 0.0003
  max_steps: 100000
  warmup_steps: 2000
  log_every: 100
  ckpt_every: 25000   # tripwires at 25K/50K/75K/100K
  grad_accum: 1
